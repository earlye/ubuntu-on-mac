name: Build MacBook Ubuntu Live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          # Ubuntu runners have ~14 GB free; we need ~20 GB for ISO + squashfs work
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install ISO customization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso rsync wget

      - name: Download Ubuntu 24.04.2 LTS ISO
        run: |
          wget -O ubuntu-original.iso \
            "https://releases.ubuntu.com/24.04.2/ubuntu-24.04.2-desktop-amd64.iso"

      - name: Extract ISO and filesystem
        run: |
          # Capture boot parameters before extraction so we can rebuild the ISO correctly.
          # xorriso -report_* as_mkisofs produces args that replicate the original hybrid boot setup.
          xorriso -indev ubuntu-original.iso \
            -report_system_area as_mkisofs 2>/dev/null > /tmp/mbr_opts.txt || true
          xorriso -indev ubuntu-original.iso \
            -report_el_torito as_mkisofs 2>/dev/null > /tmp/boot_opts.txt || true
          echo "=== MBR opts ===" && cat /tmp/mbr_opts.txt
          echo "=== boot opts ===" && cat /tmp/boot_opts.txt

          mkdir -p mnt/ ext-iso/ squashfs-root/
          sudo mount -o loop ubuntu-original.iso mnt/
          rsync -a --exclude=/casper/filesystem.squashfs mnt/ ext-iso/
          sudo unsquashfs -d squashfs-root/ mnt/casper/filesystem.squashfs
          sudo umount mnt/

      - name: Install Broadcom driver in chroot
        run: |
          # Detect the kernel version shipped inside the live ISO so we can install
          # matching headers — DKMS must compile bcmwl against the live kernel.
          KERNEL_VER=$(ls squashfs-root/lib/modules/ | head -1)
          echo "Live ISO kernel: $KERNEL_VER"

          sudo mount --bind /dev  squashfs-root/dev
          sudo mount --bind /proc squashfs-root/proc
          sudo mount --bind /sys  squashfs-root/sys
          sudo mount --bind /etc/resolv.conf squashfs-root/etc/resolv.conf

          sudo chroot squashfs-root/ bash -c "
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            # build-essential + headers are required for DKMS to compile the wl module
            apt-get install -y \
              build-essential \
              linux-headers-${KERNEL_VER} \
              dkms \
              bcmwl-kernel-source
            dkms status
            apt-get clean
          "

          sudo umount squashfs-root/dev
          sudo umount squashfs-root/proc
          sudo umount squashfs-root/sys
          sudo umount squashfs-root/etc/resolv.conf

      - name: Rebuild SquashFS filesystem
        run: |
          sudo rm -f ext-iso/casper/filesystem.squashfs
          sudo mksquashfs squashfs-root/ ext-iso/casper/filesystem.squashfs -comp xz
          # Ubuntu live boot reads this to size its tmpfs correctly
          sudo du -sx --block-size=1 squashfs-root/ | cut -f1 | \
            sudo tee ext-iso/casper/filesystem.size
          # Free squashfs-root now to recover ~10 GB before building the final ISO
          sudo rm -rf squashfs-root/
          df -h

      - name: Rebuild bootable ISO
        run: |
          # Feed the captured boot params back to xorriso so the new ISO has the same
          # hybrid BIOS/UEFI boot setup as the original Ubuntu ISO.
          MBR_OPTS=$(tr '\n' ' ' < /tmp/mbr_opts.txt)
          BOOT_OPTS=$(tr '\n' ' ' < /tmp/boot_opts.txt)

          # shellcheck disable=SC2086  # word-splitting of opts is intentional
          sudo xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -joliet -joliet-long \
            -volid "Ubuntu-MacBook" \
            $MBR_OPTS \
            $BOOT_OPTS \
            -output ubuntu-macbook.iso \
            ext-iso/

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-macbook-iso
          path: ubuntu-macbook.iso
          retention-days: 5
