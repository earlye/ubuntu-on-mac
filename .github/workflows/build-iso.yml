name: Build MacBook Ubuntu Live ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Free disk space
        run: |
          # Ubuntu runners have ~14 GB free; we need ~20 GB for ISO + squashfs work
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Install ISO customization tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools xorriso rsync wget

      - name: Download Ubuntu 26.04 LTS ISO
        run: |
          # Verify this URL at https://releases.ubuntu.com/26.04/ before running
          wget -q -O ubuntu-original.iso \
            "https://releases.ubuntu.com/26.04/ubuntu-26.04-desktop-amd64.iso"

      - name: Extract ISO and filesystem
        run: |
          # Capture boot parameters from the original ISO.
          # -report_system_area as_mkisofs outputs all options needed to recreate the
          # hybrid BIOS/UEFI boot setup (MBR, EFI partition, El Torito catalog).
          # Both -report_system_area and -report_el_torito produce identical output for
          # Ubuntu ISOs, so we only need one.
          xorriso -indev ubuntu-original.iso \
            -report_system_area as_mkisofs 2>/dev/null > /tmp/xorriso_opts.txt || true
          echo "=== xorriso opts ===" && cat /tmp/xorriso_opts.txt

          mkdir -p mnt/ ext-iso/ squashfs-root/
          sudo mount -o loop ubuntu-original.iso mnt/

          echo "=== ISO casper contents ==="
          ls -la mnt/casper/ 2>/dev/null || ls -la mnt/

          # Ubuntu may use a non-standard squashfs filename; find it dynamically.
          # Pick the largest .squashfs file — that is always the main live filesystem.
          SQUASHFS=$(find mnt/ -name "*.squashfs" -type f | xargs ls -S | head -1)
          if [ -z "$SQUASHFS" ]; then
            echo "ERROR: no .squashfs file found in ISO"
            find mnt/ -type f | sort
            exit 1
          fi
          echo "Using squashfs: $SQUASHFS"
          # Save relative path (strip leading "mnt/") for use in later steps
          printf '%s' "${SQUASHFS#mnt/}" > /tmp/squashfs_path.txt

          rsync -a --exclude="/${SQUASHFS#mnt/}" mnt/ ext-iso/
          sudo unsquashfs -no-progress -d squashfs-root/ "$SQUASHFS"
          sudo umount mnt/

      - name: Install Broadcom driver in chroot
        run: |
          # vmlinuz is a compressed bzImage; strings won't find the version.
          # /lib/modules/ is the reliable source for the installed kernel version.
          KERNEL_VER=$(ls squashfs-root/lib/modules/ | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$' | sort -V | tail -1)
          echo "Boot kernel: $KERNEL_VER"

          sudo mount --bind /dev  squashfs-root/dev
          sudo mount --bind /proc squashfs-root/proc
          sudo mount --bind /sys  squashfs-root/sys
          sudo mount --bind /etc/resolv.conf squashfs-root/etc/resolv.conf

          sudo chroot squashfs-root/ bash -c "
            set -e -v
            export DEBIAN_FRONTEND=noninteractive
            # The live ISO ships a cdrom apt source that doesn't exist in chroot.
            # Ubuntu 26+ uses DEB822 .sources format; scrub both .list and .sources files.
            sed -i '/cdrom/d' /etc/apt/sources.list 2>/dev/null || true
            find /etc/apt/sources.list.d/ \( -name '*.list' -o -name '*.sources' \) | xargs -r grep -rl 'cdrom' 2>/dev/null | xargs -r rm -f || true
            apt-get update -qq
            # build-essential + headers are required for DKMS to compile the wl module
            apt-get install -y -qq build-essential linux-headers-${KERNEL_VER} dkms
            # Broadcom STA driver: Ubuntu <=24 calls it bcmwl-kernel-source, 26+ may use
            # broadcom-sta-dkms. Probe both; postinst triggers DKMS so cap at 30 min.
            BCMWL_PKG=
            apt-cache show bcmwl-kernel-source  >/dev/null 2>&1 && BCMWL_PKG=bcmwl-kernel-source
            apt-cache show broadcom-sta-dkms    >/dev/null 2>&1 && BCMWL_PKG=broadcom-sta-dkms
            if [ -n \"\$BCMWL_PKG\" ]; then
              timeout 1800 apt-get install -y -qq \"\$BCMWL_PKG\" || \
                echo \"WARNING: \$BCMWL_PKG install/DKMS build failed or timed out after 30 min\"
            else
              echo 'WARNING: No Broadcom STA driver package found in repos'
            fi
            # dkms status can hang waiting for a lock if an orphaned DKMS build is still running
            timeout 30 dkms status || true
            apt-get clean
          "

          sudo umount squashfs-root/dev
          sudo umount squashfs-root/proc
          sudo umount squashfs-root/sys
          sudo umount squashfs-root/etc/resolv.conf

      - name: Tag derivative and verify squashfs
        run: |
          echo "=== OS Release (original) ==="
          cat squashfs-root/etc/os-release

          # Stamp derivative identity using standard freedesktop VARIANT fields.
          # sed out any existing VARIANT/VARIANT_ID lines first so we don't duplicate.
          sudo sed -i \
            -e 's|^PRETTY_NAME=.*|PRETTY_NAME="Ubuntu 26.04 LTS [raccoon-wyrm]"|' \
            -e '/^VARIANT=/d' \
            -e '/^VARIANT_ID=/d' \
            squashfs-root/etc/os-release
          printf 'VARIANT="raccoon-wyrm"\nVARIANT_ID=raccoon-wyrm\n' \
            | sudo tee -a squashfs-root/etc/os-release > /dev/null
          # Keep lsb-release in sync if present
          if [ -f squashfs-root/etc/lsb-release ]; then
            sudo sed -i \
              's|^DISTRIB_DESCRIPTION=.*|DISTRIB_DESCRIPTION="Ubuntu 26.04 LTS [raccoon-wyrm]"|' \
              squashfs-root/etc/lsb-release
          fi

          echo "=== OS Release (updated) ==="
          cat squashfs-root/etc/os-release

          # Verify Broadcom wl module is present — fail the build if it's missing.
          KERNEL_VER=$(ls squashfs-root/lib/modules/ | grep -E '^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-generic$' | sort -V | tail -1)
          WL_MODULE=$(find squashfs-root/lib/modules/${KERNEL_VER} -name "wl.ko*" -type f | head -1)
          if [ -z "$WL_MODULE" ]; then
            echo "ERROR: wl.ko not found under lib/modules/${KERNEL_VER} — Broadcom driver not installed"
            exit 1
          fi
          echo "Broadcom module verified: ${WL_MODULE}"

      - name: Rebuild SquashFS filesystem
        run: |
          SQUASHFS_RELPATH=$(cat /tmp/squashfs_path.txt)
          sudo rm -f "ext-iso/$SQUASHFS_RELPATH"
          sudo mksquashfs squashfs-root/ "ext-iso/$SQUASHFS_RELPATH" -comp xz -no-progress
          # Ubuntu live boot reads filesystem.size to size its tmpfs correctly
          sudo du -sx --block-size=1 squashfs-root/ | cut -f1 | \
            sudo tee ext-iso/casper/filesystem.size
          # Free squashfs-root to recover ~10 GB before building the final ISO
          sudo rm -rf squashfs-root/
          df -h

      - name: Rebuild bootable ISO
        run: |
          # Strip -V and --modification-date from captured opts; we supply -volid ourselves.
          # Use eval so the shell quoting embedded in xorriso's output is interpreted
          # correctly (e.g. -e '--interval:...' and 'ubuntu-original.iso' references).
          OPTS=$(grep -v '^-V ' /tmp/xorriso_opts.txt | grep -v '^--modification-date' | tr '\n' ' ')
          eval "sudo xorriso -as mkisofs \
            -iso-level 3 \
            -full-iso9660-filenames \
            -joliet -joliet-long \
            -volid 'Ubuntu-MacBook' \
            $OPTS \
            -output ubuntu-macbook.iso \
            ext-iso/"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: ubuntu-macbook-iso
          path: ubuntu-macbook.iso
          retention-days: 5
